services:

  frontend:
    build: ./frontend
    environment:
      - NEXT_PUBLIC_API_URL=https://api.triage.mustafalsalem.com
    ports:
      - "127.0.0.1:3000:3000"

    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

    depends_on:
      - backend

  backend:
    build: ./backend

    ports:
      - "127.0.0.1:8000:8000"

    volumes:
      - ./backend:/app

    env_file:
      - .env

    depends_on:
      - redis

  redis:
    image: redis:7-alpine

    healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5

    ports:
      - "6379:6379"

  celery_worker:
    build:
      context: ./backend

    command: celery -A app.core.celeryapp.celery_app worker --loglevel=info

    volumes:
      - ./backend:/app

    env_file:
      - .env

    depends_on:
      - backend
      - redis

  flower:
    build:
      context: ./backend

    command: celery -A app.core.celeryapp.celery_app flower --port=5555

    ports:
      - "127.0.0.1:5555:5555"

    env_file:
      - .env

    depends_on:
      - celery_worker
      - redis